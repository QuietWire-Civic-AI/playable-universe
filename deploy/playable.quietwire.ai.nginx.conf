server {
    listen 80;
    listen [::]:80;
    server_name playable.quietwire.ai;

    root /opt/fred-node/runtime/cap/frontend/dist/playable;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name playable.quietwire.ai;

    root /opt/fred-node/runtime/cap/frontend/dist/playable;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/playable.quietwire.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/playable.quietwire.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /api/ {
        proxy_pass http://127.0.0.1:18270/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 9m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
